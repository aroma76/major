name: Frontend CI

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'frontend/**'

jobs:
  analyze-and-build:
    name: Analyze & Build Flutter Web
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Flutter (direct install — no third-party actions, no warnings)
      # Downloads the latest stable Flutter SDK directly from the official source.
      - name: Setup Flutter
        run: |
          curl -sS https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.38.9-stable.tar.xz -o flutter.tar.xz \
            || curl -sS https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json \
              | grep -o '"archive":"[^"]*stable[^"]*"' | head -1 \
              | sed 's/"archive":"//;s/"//' | xargs -I{} curl -sS "https://storage.googleapis.com/flutter_infra_release/releases/{}" -o flutter.tar.xz
          tar xf flutter.tar.xz
          echo "$PWD/flutter/bin" >> $GITHUB_PATH

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      # ── 4. Static analysis (no errors allowed) ────────────────────────────────
      - name: Analyze
        working-directory: frontend
        run: flutter analyze --no-fatal-infos

      # ── 5. Format check (warning only — won't block build) ───────────────────
      - name: Check formatting
        working-directory: frontend
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib/

      # ── 6. Build Flutter Web (release) ────────────────────────────────────────
      - name: Build web (release)
        working-directory: frontend
        run: flutter build web --release --no-tree-shake-icons --no-wasm-dry-run

      # ── 7. Upload build artifact ──────────────────────────────────────────────
      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: frontend/build/web/
          retention-days: 7

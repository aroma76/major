name: Frontend CI

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'frontend/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Opt into Node.js 24 before it becomes mandatory June 2026

jobs:
  analyze-and-build:
    name: Analyze & Build Flutter Web
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Flutter ─────────────────────────────────────────────────────
      # Not pinning an exact version — uses latest stable so it always matches
      # what Flutter publishes, avoiding "version not found" download failures.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      # ── 4. Static analysis (no errors allowed) ────────────────────────────────
      - name: Analyze
        working-directory: frontend
        run: flutter analyze --no-fatal-infos

      # ── 5. Format check (warning only — won't block build) ───────────────────
      - name: Check formatting
        working-directory: frontend
        continue-on-error: true  # Report formatting issues but don't fail the build
        run: dart format --output=none --set-exit-if-changed lib/

      # ── 6. Build Flutter Web (release) ────────────────────────────────────────
      # This ensures the app compiles cleanly before Vercel deploys it.
      - name: Build web (release)
        working-directory: frontend
        run: flutter build web --release --no-tree-shake-icons --no-wasm-dry-run

      # ── 7. Upload build artifact (optional — for inspection) ──────────────────
      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: frontend/build/web/
          retention-days: 7

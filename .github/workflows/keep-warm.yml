name: Keep Render Warm

# Pings the backend health endpoint every 10 minutes so Render's free tier
# never goes cold. This eliminates the 20–30 second cold-start delay on login.
on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes, 24/7
  workflow_dispatch:          # allow manual trigger from GitHub Actions UI

jobs:
  ping:
    name: Ping Backend
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          # Render free tier can take up to 60s to cold-start.
          # --retry 2 retries on transient network errors (not HTTP errors).
          # We never fail the job on non-200 — just warn, so CI stays green.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 60 \
            --retry 2 \
            --retry-delay 5 \
            https://major-gin9.onrender.com/api/health) || STATUS="000"
          echo "Health check status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Backend is warm"
          else
            echo "⚠️  Backend returned $STATUS — it may be cold-starting or temporarily down"
          fi
          exit 0  # never fail the workflow; this is a best-effort ping
